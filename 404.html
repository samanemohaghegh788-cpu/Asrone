<!DOCTYPE html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>صفحه پیدا نشد | چای‌عصر</title><meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">

<style>:root{--bg:#f3f9f5;--ink:#1d3b3a;--mute:#5b7473;--tea:#f4a62a;color-scheme:light dark}
@media(prefers-color-scheme:dark){:root{--bg:#10211f;--ink:#eaf6f1;--mute:#9bbab3}}
*{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;text-align:center;padding:24px;background:var(--bg);color:var(--ink);font:17px/1.9 Vazirmatn,Tahoma,sans-serif}
svg{width:200px;max-width:60%}h1{font-size:clamp(34px,9vw,52px);margin:8px 0 0}p{color:var(--mute);margin:4px 0 22px}
a{display:inline-block;background:var(--ink);color:var(--bg);padding:12px 32px;border-radius:99px;text-decoration:none;font-weight:700}a:focus-visible{outline:3px solid #6fbdf0;outline-offset:3px}
.s{fill:none;stroke:var(--mute);stroke-width:5;stroke-linecap:round;opacity:.45}@media(prefers-reduced-motion:no-preference){.s{animation:r 3.4s ease-in-out infinite}@keyframes r{0%{transform:translateY(8px);opacity:0}40%{opacity:.55}100%{transform:translateY(-14px);opacity:0}}}</style></head>

<h1>۴۰۴ · چایت این‌جا نیست</h1><p>این صفحه پیدا نشد؛ شاید آدرس اشتباه باشه یا صفحه جابه‌جا شده باشه.</p>
